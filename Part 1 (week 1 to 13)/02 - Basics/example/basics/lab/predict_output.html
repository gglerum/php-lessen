<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 2: Wat wordt er getoond?</title>
    <link rel="stylesheet" href="lab.css">
</head>
<body>
<main>
    <p class="muted"><a href="index.html">Alle labs</a></p>
    <h1>Lab 2: Wat wordt er getoond?</h1>
    <p class="muted">Lees de code, kies wat je denkt dat er gebeurt en controleer je antwoord. Daarna lees je waarom.</p>

    <noscript><p class="noscript">Dit lab heeft JavaScript nodig.</p></noscript>

    <nav aria-label="Scenario's"><ol id="steps"></ol></nav>

    <h2 id="title"></h2>
    <pre><code id="code"></code></pre>

    <form class="quiz" id="quiz"></form>

    <div class="controls">
        <a class="button secondary" id="previous" href="#">Vorige</a>
        <a class="button" id="next" href="#">Volgend scenario</a>
    </div>
</main>

<script>
// De uitkomsten zijn vooraf bepaald. Controleer ze met: php verify_lab3.php
const scenarios = [
    {
        title: 'Rekenen met operators',
        question: 'Wat toont het script?',
        code: `$attempts = 7;
$attempts--;
$attempts = $attempts - 2;
echo $attempts;`,
        options: ['5', '4', '6'],
        correct: 1,
        why: '$attempts-- haalt 1 af (6), daarna haalt $attempts - 2 er nog 2 af. 7 - 1 - 2 = 4.',
    },
    {
        title: 'Tekst aan elkaar plakken',
        question: 'Wat toont het script?',
        code: `$display = "";
$display .= "k";
$display .= "_";
$display .= "w";
echo $display;`,
        options: ['k_w', 'w', 'kw'],
        correct: 0,
        why: 'De operator .= plakt tekst achteraan de bestaande tekst. De variabele wordt dus telkens langer: "k", "k_" en "k_w".',
    },
    {
        title: 'Een for loop',
        question: 'Wat toont het script?',
        code: `$word = "kiwi";
$count = 0;
for ($i = 0; $i < strlen($word); $i++) {
    $count = $count + 1;
}
echo $count;`,
        options: ['3', '4', '5'],
        correct: 1,
        why: 'strlen("kiwi") is 4. $i loopt van 0 tot en met 3 (zolang $i < 4), dus de loop draait 4 keer.',
    },
    {
        title: 'Een while loop',
        question: 'Wat toont het script?',
        code: `$attempts = 3;
while ($attempts > 0) {
    echo $attempts;
    $attempts--;
}`,
        options: ['321', '3210', '210'],
        correct: 0,
        why: 'De loop draait zolang $attempts groter is dan 0. Hij toont 3, 2 en 1. Bij 0 is de voorwaarde niet meer waar en stopt de loop, nog voor er 0 wordt getoond.',
    },
    {
        title: 'if, else if en else',
        question: 'Wat toont het script?',
        code: `$score = 55;

if ($score >= 80) {
    echo "Goed";
} elseif ($score >= 55) {
    echo "Voldoende";
} else {
    echo "Onvoldoende";
}`,
        options: ['Goed', 'Voldoende', 'Onvoldoende'],
        correct: 1,
        why: 'PHP loopt van boven naar beneden en voert alleen het eerste blok uit waarvan de voorwaarde waar is. 55 >= 80 is niet waar, 55 >= 55 wel.',
    },
    {
        title: 'switch zonder break',
        question: 'Wat toont het script?',
        code: `$attempts = 5;

switch ($attempts) {
    case 5:
        echo "hoofd ";
    case 4:
        echo "romp ";
        break;
    case 3:
        echo "arm ";
        break;
}`,
        options: ['hoofd ', 'hoofd romp ', 'romp '],
        correct: 1,
        why: 'Zonder break gaat een switch gewoon door met het volgende case, ook al past die niet. Na "hoofd " volgt "romp ", en daar staat wel een break.',
    },
];

const steps = document.getElementById('steps');
const title = document.getElementById('title');
const code = document.getElementById('code');
const quizForm = document.getElementById('quiz');
const previous = document.getElementById('previous');
const next = document.getElementById('next');

// het scenario staat in de URL (#3), zodat verversen en links delen werken
function currentIndex() {
    const number = parseInt(location.hash.replace('#', ''), 10);
    return number >= 1 && number <= scenarios.length ? number - 1 : 0;
}

function show() {
    const index = currentIndex();
    const scenario = scenarios[index];

    steps.replaceChildren();
    scenarios.forEach((item, i) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + (i + 1);
        a.textContent = String(i + 1);
        a.setAttribute('aria-label', `Scenario ${i + 1}: ${item.title}`);
        if (i === index) a.setAttribute('aria-current', 'step');
        li.append(a);
        steps.append(li);
    });

    title.textContent = `Scenario ${index + 1} van ${scenarios.length}: ${scenario.title}`;
    code.textContent = scenario.code;

    previous.hidden = index === 0;
    previous.href = '#' + index;
    next.hidden = index === scenarios.length - 1;
    next.href = '#' + (index + 2);

    quizForm.replaceChildren();
    const fieldset = document.createElement('fieldset');
    const legend = document.createElement('legend');
    legend.textContent = scenario.question;
    fieldset.append(legend);

    scenario.options.forEach((text, i) => {
        const label = document.createElement('label');
        label.className = 'option';
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'answer';
        input.value = String(i);
        label.append(input, text);
        fieldset.append(label);
    });

    const actions = document.createElement('div');
    actions.className = 'actions';
    const button = document.createElement('button');
    button.type = 'submit';
    button.textContent = 'Controleer';
    actions.append(button);

    const result = document.createElement('div');
    result.setAttribute('aria-live', 'polite');
    quizForm.append(fieldset, actions, result);

    quizForm.onsubmit = (event) => {
        event.preventDefault();
        const chosen = quizForm.querySelector('input[name="answer"]:checked');
        result.replaceChildren();
        const box = document.createElement('div');
        if (!chosen) {
            box.className = 'feedback warn';
            box.textContent = 'Kies eerst een antwoord.';
        } else {
            const isCorrect = parseInt(chosen.value, 10) === scenario.correct;
            box.className = 'feedback ' + (isCorrect ? 'ok' : 'warn');
            const strong = document.createElement('strong');
            strong.textContent = isCorrect
                ? `Goed: ${scenario.options[scenario.correct]}.`
                : `Niet helemaal. Het antwoord is: ${scenario.options[scenario.correct]}.`;
            box.append(strong, scenario.why);
        }
        result.append(box);
    };
}

window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
