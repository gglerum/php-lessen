<html>

<head>
    <title>Fill out Book Form</title>
    <style>
        label {
            display: inline-block;
            width: 100px;
        }

        div {
            margin: 0 0 5px;
        }
    </style>
</head>

<body>
    <form method="post" action="index.php">
        <div>
            <label for="title">
                Title:
            </label>
            <input name="title" />
        </div>
        <div>
            <label for="author">
                Author:
            </label>
            <input name="author" />
        </div>
        <div>
            <label for="isbn">
                Isbn:
            </label>
            <input name="isbn" />
        </div>
        <div>
            <label for="genre">
                Genre:
            </label>
            <input name="genre" />
        </div>
        <div>
            <label for="ageRating">
                Age Rating:
            </label>
            <input name="ageRating" />
        </div>
        <div>
            <label for="pages">
                Pages:
            </label>
            <input name="pages" type="number" />
        </div>
        <div>
            <label for="publisher">
                Publisher:
            </label>
            <input name="publisher" />
        </div>
        <div>
            <label for="publishedAt">
                Published At:
            </label>
            <input name="publishedAt" type="date" />
        </div>
        <input type="submit" value="Submit" />
    </form>
</body>

</html>
