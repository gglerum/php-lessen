name: Site publiceren

# Publiceert het hele lespakket (alle Markdown-lessen, voorbeeldcode en de interactieve labs)
# als Jekyll-site met het just-the-docs thema op GitHub Pages.
# scripts/prepare-site.py zet front matter op de Markdown in een build-kopie (_site_src),
# zodat de bronbestanden onaangeroerd blijven.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# een nieuwe publicatie vervangt een lopende
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Front matter en navigatie genereren
        run: python3 scripts/prepare-site.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
