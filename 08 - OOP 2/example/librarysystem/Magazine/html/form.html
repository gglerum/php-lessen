<html>

<head>
    <title>Fill out Magazine Form</title>
    <style>
        label {
            display: inline-block;
            width: 100px;
        }

        div {
            margin: 0 0 5px;
        }
    </style>
</head>

<body>
    <form method="post" action="/?type=magazine&action=store">
        <div>
            <label for="title">
                Title:
            </label>
            <input name="title" />
        </div>
        <div>
            <label for="editor">
                Editor:
            </label>
            <input name="editor" />
        </div>
        <div>
            <label for="isnn">
                Isnn:
            </label>
            <input name="isnn" />
        </div>
        <div>
            <label for="genre">
                Genre:
            </label>
            <input name="genre" />
        </div>
        <div>
            <label for="appearance">
                Appearance:
            </label>
            <select name="appearance">
                <option value="1">Weekly</option>
                <option value="2">Monthly</option>
                <option value="3">Yearly</option>
            </select>
        </div>
        <div>
            <label for="age_rating">
                Age Rating:
            </label>
            <input name="age_rating" />
        </div>
        <div>
            <label for="pages">
                Pages:
            </label>
            <input name="pages" type="number" />
        </div>
        <div>
            <label for="publisher">
                Publisher:
            </label>
            <input name="publisher" />
        </div>
        <div>
            <label for="published_at">
                Published At:
            </label>
            <input name="published_at" type="date" />
        </div>
        <input type="submit" value="Submit" />
    </form>
</body>

</html>
